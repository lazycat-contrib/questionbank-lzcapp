version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: backend
build:
  toolchains: []
  run_buildscript: false
images:
  - id: backend
    target: service
    service: backend
    source: ghcr.io/gygy-open/question-bank-backend
    channel: stable
    sort: semver
    tag_regex: '^[0-9]+[.][0-9]+[.][0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true
  - id: worker
    target: service
    service: worker
    source: ghcr.io/gygy-open/question-bank-backend
    channel: stable
    sort: semver
    tag_regex: '^[0-9]+[.][0-9]+[.][0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true
  - id: frontend
    target: service
    service: frontend
    source: ghcr.io/gygy-open/question-bank-frontend
    channel: stable
    sort: semver
    tag_regex: '^[0-9]+[.][0-9]+[.][0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true
  - id: mysql
    target: service
    service: mysql
    source: docker.io/library/mysql
    channel: custom
    sort: created
    tag_regex: '^8[.]0$'
    delivery:
      mode: mirror
      require_digest_match: true
  - id: chromadb
    target: service
    service: chromadb
    source: docker.io/chromadb/chroma
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: QuestionBank
    skip_if_version_exists: true
